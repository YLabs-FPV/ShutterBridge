name: Camera compatibility report
description: Tell us how ShutterBridge worked with your camera - even if it all worked.
title: "[Camera] <model here>"
labels: ["camera", "compatibility-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Reports like this build the
        [compatibility table](https://shutterbridge.yarosfpv.com/docs/compatibility).
        Fill in what you can - a partial report is still useful.
  - type: input
    id: model
    attributes:
      label: Camera model
      placeholder: "DJI Osmo Action 5 Pro"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend used
      description: The Camera type you selected in the Web UI.
      options:
        - DJI Osmo (Nano)
        - DJI Action / 360
        - GoPro (HERO9+)
    validations:
      required: true
  - type: input
    id: fw-version
    attributes:
      label: Firmware version tested
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: overall
    attributes:
      label: Overall result
      options:
        - Works fully
        - Works with limitations
        - Doesn't work
    validations:
      required: true
  - type: checkboxes
    id: features
    attributes:
      label: What worked?
      description: Tick everything you were able to confirm.
      options:
        - label: Connect + auto-reconnect
        - label: Pairing (PIN / bond)
        - label: OSD telemetry (record, battery, SD, timers)
        - label: Mode readout (video / photo)
        - label: Photo / video mode switch
        - label: Resolution / FPS readout
        - label: Start / stop recording
        - label: Take photo
        - label: Preset switching (GoPro)
  - type: textarea
    id: notes
    attributes:
      label: Notes, quirks, or anything that didn't work
      description: Limitations, oddities, or steps that were needed. Photos/video welcome.
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I'm OK with this report being used to update the public compatibility table.
          required: true
