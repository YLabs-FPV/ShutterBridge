name: Build & release firmware

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  # Flash offsets - identical for every board we target (same partition table,
  # same bootloader-at-0x0 layout) - must match src/components/flasher/Flasher.svelte (OFFSETS)
  OFFSET_BOOTLOADER: "0x0"
  OFFSET_PARTITIONS: "0x8000"
  OFFSET_BOOT_APP0: "0xe000"
  OFFSET_FIRMWARE: "0x10000"
  OFFSET_LITTLEFS: "0x310000"

jobs:
  build:
    name: Build (${{ matrix.env }})
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    strategy:
      matrix:
        include:
          - env: esp32s3-zero
            chip: esp32s3
          - env: esp32c3-supermini
            chip: esp32c3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify FW_VERSION matches the tag
        run: |
          FW=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/src/config.h)
          echo "config.h FW_VERSION = $FW"
          echo "tag version         = ${{ steps.ver.outputs.version }}"
          if [ "$FW" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::FW_VERSION in firmware/src/config.h ($FW) does not match the release tag (${{ steps.ver.outputs.version }}). Bump config.h and re-tag."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO & esptool
        run: pip install --upgrade platformio esptool

      - name: Build firmware
        working-directory: firmware
        run: pio run -e "${{ matrix.env }}"

      - name: Build filesystem (Web UI)
        working-directory: firmware
        run: pio run -e "${{ matrix.env }}" -t buildfs

      - name: Collect flashable images
        run: |
          set -euo pipefail
          BUILD="firmware/.pio/build/${{ matrix.env }}"
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32/tools/partitions -name boot_app0.bin | head -n1)
          DEST="dist/${{ matrix.env }}"
          mkdir -p "$DEST"
          cp "$BUILD/bootloader.bin" "$DEST/bootloader.bin"
          cp "$BUILD/partitions.bin" "$DEST/partitions.bin"
          cp "$BOOT_APP0"            "$DEST/boot_app0.bin"
          cp "$BUILD/firmware.bin"   "$DEST/firmware.bin"
          cp "$BUILD/littlefs.bin"   "$DEST/littlefs.bin"
          echo "Collected:"
          ls -l "$DEST"

      - name: Build single merged image (for manual esptool flashing)
        run: |
          set -euo pipefail
          DEST="dist/${{ matrix.env }}"
          MERGED="$DEST/ShutterBridge-${{ steps.ver.outputs.version }}-${{ matrix.env }}-merged.bin"
          esptool --chip ${{ matrix.chip }} merge_bin -o "$MERGED" \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            "$OFFSET_BOOTLOADER" "$DEST/bootloader.bin" \
            "$OFFSET_PARTITIONS" "$DEST/partitions.bin" \
            "$OFFSET_BOOT_APP0"  "$DEST/boot_app0.bin" \
            "$OFFSET_FIRMWARE"   "$DEST/firmware.bin" \
            "$OFFSET_LITTLEFS"   "$DEST/littlefs.bin"
          echo "Merged image:"
          ls -l "$MERGED"

      - name: Rename parts with board prefix
        run: |
          set -euo pipefail
          cd "dist/${{ matrix.env }}"
          for f in bootloader partitions boot_app0 firmware littlefs; do
            mv "$f.bin" "${{ matrix.env }}-$f.bin"
          done
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: dist/${{ matrix.env }}/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true

      - name: List collected files
        run: ls -l dist

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ShutterBridge ${{ needs.build.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: dist/*
